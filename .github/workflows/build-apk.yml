name: Build Android Release APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile_women/**'
      - 'apps/mobile_volunteer/**'
      - 'packages/shared_dart/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare shared_dart package
        run: |
          cd packages/shared_dart
          dart pub get

      - name: Scaffold & Build Women SOS APK
        run: |
          cd apps/mobile_women
          rm -rf android
          flutter create --platforms=android .
          
          # Inject required permissions into AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.CALL_PHONE"/>' android/app/src/main/AndroidManifest.xml

          # Ensure compatible SDK levels for plugins (geolocator, secure storage)
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle* || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle* || true

          flutter pub get
          flutter build apk --debug
          
          mkdir -p ../../dist-apks
          cp build/app/outputs/flutter-apk/app-debug.apk ../../dist-apks/safelink-women.apk
          ls -lh ../../dist-apks/safelink-women.apk

      - name: Scaffold & Build Volunteer Responder APK
        run: |
          cd apps/mobile_volunteer
          rm -rf android
          flutter create --platforms=android .
          
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.CALL_PHONE"/>' android/app/src/main/AndroidManifest.xml

          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle* || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle* || true

          flutter pub get
          flutter build apk --debug

          mkdir -p ../../dist-apks
          cp build/app/outputs/flutter-apk/app-debug.apk ../../dist-apks/safelink-volunteer.apk
          ls -lh ../../dist-apks/safelink-volunteer.apk

      - name: Deploy Compiled Real APKs to Web Downloads
        run: |
          mkdir -p apps/web/public/downloads
          cp dist-apks/safelink-women.apk apps/web/public/downloads/safelink-women.apk
          cp dist-apks/safelink-volunteer.apk apps/web/public/downloads/safelink-volunteer.apk
          
          ls -lh apps/web/public/downloads/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/downloads/*.apk
          git commit -m "chore(release): deploy real compiled Android APKs to web downloads [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safelink-android-apks
          path: dist-apks/*.apk
          retention-days: 30
