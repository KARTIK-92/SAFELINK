name: Build Android Release APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile_women/**'
      - 'apps/mobile_volunteer/**'
      - 'packages/shared_dart/**'
      - 'scripts/build_mobile_apks.py'
      - '.github/workflows/build-apk.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android SDK & Accept Licenses
        run: |
          flutter config --no-analytics
          echo "ANDROID_HOME: $ANDROID_HOME"
          flutter config --android-sdk "$ANDROID_HOME"
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Execute Automated Mobile APK Build Script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u scripts/build_mobile_apks.py 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Deploy Compiled Real APKs to Web Downloads
        run: |
          ls -lh apps/web/public/downloads/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apps/web/public/downloads/*.apk
          if git diff --staged --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "chore(release): deploy real compiled Android APKs to web downloads [skip ci]"
            git push origin HEAD:main || echo "Git push skipped"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safelink-android-apks
          path: dist-apks/*.apk
          retention-days: 30
