name: SafeLink CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Geo & DB
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: |
          cd apps/api
          pytest tests -v --tb=short

  build-web:
    name: Next.js Web Portal Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm install

      - name: Next.js Production Build
        run: |
          cd apps/web
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://api.safelink.org/api/v1

  check-mobile:
    name: Flutter & Dart Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Check shared_dart
        run: |
          cd packages/shared_dart
          dart pub get
          dart analyze

      - name: Check mobile_women
        run: |
          cd apps/mobile_women
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Check mobile_volunteer
        run: |
          cd apps/mobile_volunteer
          flutter pub get
          flutter analyze --no-fatal-infos
